name: Apply Google runtime wire migration

on:
  push:
    branches:
      - feat/browser-qa-performance
    paths:
      - scripts/migrate-fonttrust-google-wire.mjs
      - .github/workflows/apply-google-wire-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/browser-qa-performance

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Apply deterministic migration
        run: node scripts/migrate-fonttrust-google-wire.mjs
      - name: Validate migrated tree
        run: npm run check
      - name: Commit migration and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/migrate-fonttrust-google-wire.mjs .github/workflows/apply-google-wire-migration.yml
          git add src/app/lib/fontTrust.ts
          git commit -m "perf: switch Google runtime to compact wire"
          git push origin HEAD:feat/browser-qa-performance
