name: Build open artifact inspection report

on:
  push:
    branches:
      - main
      - feat/font-data-engine
    paths:
      - src/app/data/verified/artifacts/open-fonts.json
      - scripts/font-data/build-artifact-report.mjs
      - scripts/font-data/validate-open-artifacts-strict.mjs
      - .github/workflows/artifact-report.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate artifact identity/integrity
        run: node --experimental-strip-types scripts/font-data/validate-open-artifacts-strict.mjs
      - name: Generate report
        run: node scripts/font-data/build-artifact-report.mjs
      - name: Commit report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- docs/ARTIFACT-INSPECTION.md)" ]; then
            echo "Artifact report is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARTIFACT-INSPECTION.md
          git commit -m "docs: refresh open font artifact inspection report"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
