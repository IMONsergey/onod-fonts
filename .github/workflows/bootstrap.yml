name: Bootstrap standalone project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore cleaned project
        run: |
          cat .bootstrap/payload.part* | base64 -d > /tmp/onod-fonts.tar.xz
          tar -xJf /tmp/onod-fonts.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/deploy-pages.yml

      - name: Persist cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: import standalone Figma Make app"
          git push
