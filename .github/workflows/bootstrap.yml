name: Bootstrap standalone project

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Restore standalone project
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/payload.part00
          cat .bootstrap/payload.part* | base64 -d > /tmp/onod-fonts.tar.xz
          tar -xJf /tmp/onod-fonts.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Persist restored source to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: import standalone Figma Make app"
          git push origin "HEAD:${TARGET_BRANCH}"
