name: Deploy ONOD Fonts to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: onod-fonts-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run check

      - name: Prepare GitHub Pages bundle
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish dist to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      - name: Request GitHub Pages publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REQUEST_HTTP=$(curl -sS -o /tmp/pages-request.json -w '%{http_code}' -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true)
          echo "${REQUEST_HTTP}" > /tmp/pages-request-http.txt

      - name: Capture Pages API diagnostics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITE_HTTP=$(curl -sS -o dist/pages-site.json -w '%{http_code}' -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)
          BUILD_HTTP=$(curl -sS -o dist/pages-build-latest.json -w '%{http_code}' -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" || true)
          cp /tmp/pages-request.json dist/pages-request.json 2>/dev/null || printf '{}\n' > dist/pages-request.json
          REQUEST_HTTP=$(cat /tmp/pages-request-http.txt 2>/dev/null || printf '000')
          printf '{"request_http":"%s","site_http":"%s","build_http":"%s","source_sha":"%s"}\n' \
            "${REQUEST_HTTP}" "${SITE_HTTP}" "${BUILD_HTTP}" "${GITHUB_SHA}" > dist/pages-probe.json

          cd dist
          git add pages-request.json pages-site.json pages-build-latest.json pages-probe.json
          git commit -m "diagnostic: Pages API status for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
