name: Layout and Browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onod-fonts-browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Use installed Chrome
        run: |
          google-chrome --version
          echo "QA_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/onod-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/onod-fonts/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/onod-preview.log
          exit 1
      - name: Fixed and sticky regression contract
        env:
          QA_BASE_URL: http://127.0.0.1:4173/onod-fonts/
        run: npm run test:layout
      - name: Functional, responsive and accessibility gates
        env:
          QA_BASE_URL: http://127.0.0.1:4173/onod-fonts/
        run: npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onod-browser-qa
          path: .worklogs/browser-qa/
          include-hidden-files: true
          retention-days: 14
      - name: Preview diagnostics
        if: failure()
        run: cat /tmp/onod-preview.log || true
