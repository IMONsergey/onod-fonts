name: One-shot monochrome source cleanup

on:
  push:
    branches:
      - chore/monochrome-source-cleanup

permissions:
  contents: write

concurrency:
  group: monochrome-source-cleanup
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: chore/monochrome-source-cleanup
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Normalize legacy chromatic utilities
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.join(process.cwd(), 'src');
          const extensions = new Set(['.css', '.ts', '.tsx', '.js', '.jsx']);
          const families = ['red','orange','amber','yellow','lime','green','emerald','teal','cyan','sky','blue','indigo','violet','purple','fuchsia','pink','rose'];
          const utilities = ['bg','text','border','ring','outline','decoration','divide','placeholder','caret','accent','fill','stroke','shadow','from','via','to'];
          const utilityPattern = new RegExp(`\\b(${utilities.join('|')})-(${families.join('|')})-(50|100|200|300|400|500|600|700|800|900|950)(\\/\\d+)?\\b`, 'g');

          const walk = directory => fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
            const file = path.join(directory, entry.name);
            if (entry.isDirectory()) return walk(file);
            return extensions.has(path.extname(entry.name)) ? [file] : [];
          });

          let changedFiles = 0;
          let replacements = 0;
          for (const file of walk(root)) {
            const original = fs.readFileSync(file, 'utf8');
            let next = original.replace(utilityPattern, (_match, utility, _family, shade, alpha = '') => {
              replacements += 1;
              return `${utility}-neutral-${shade}${alpha}`;
            });

            for (const family of families) {
              const attributePattern = new RegExp(`\\b(fill|stroke)=(['"])${family}\\2`, 'gi');
              next = next.replace(attributePattern, (_match, property) => {
                replacements += 1;
                return `${property}="black"`;
              });
              const cssPaintPattern = new RegExp(`\\b(color|background-color|border-color):\\s*${family}\\b`, 'gi');
              next = next.replace(cssPaintPattern, (_match, property) => {
                replacements += 1;
                return `${property}: black`;
              });
            }

            if (next !== original) {
              fs.writeFileSync(file, next);
              changedFiles += 1;
              console.log(`normalized ${path.relative(process.cwd(), file)}`);
            }
          }

          console.log(`monochrome normalization: ${replacements} replacements across ${changedFiles} files`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate monochrome source
        run: npm run ui:monochrome:validate

      - name: Typecheck and build
        run: npm run typecheck && npm run build

      - name: Commit normalized source and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/monochrome-source-cleanup.yml
          git add src
          git diff --cached --stat
          git commit -m "refactor(ui): remove legacy chromatic utilities"
          git push origin HEAD:chore/monochrome-source-cleanup
