name: Update React Router lockfile

on:
  push:
    branches:
      - feat/trust-engine
    paths:
      - package.json

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/trust-engine
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Update exact dependency and lockfile
        run: npm install react-router@7.18.2 --save-exact
      - name: Verify production audit and release gate
        run: |
          npm audit --omit=dev --audit-level=high
          npm run check
      - name: Commit lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: upgrade react-router to patched release"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/trust-engine
