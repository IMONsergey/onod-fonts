name: Validate independent web identity evidence

on:
  push:
    branches:
      - main
      - feat/font-data-engine
    paths:
      - src/app/data/verified/independent-web-sources.json
      - scripts/validate-independent-web-sources.mjs
      - .github/workflows/validate-independent-web-evidence.yml
  pull_request:
    branches:
      - main
    paths:
      - src/app/data/verified/independent-web-sources.json
      - scripts/validate-independent-web-sources.mjs
      - .github/workflows/validate-independent-web-evidence.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate primary-web identity evidence
        run: node --experimental-strip-types scripts/validate-independent-web-sources.mjs
