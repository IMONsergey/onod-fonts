<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#f4f4f1" />
<title>ONOD Fonts — Design Space</title>
<meta name="description" content="ONOD Fonts — каталог открытых шрифтов для дизайнеров." />
<link rel="icon" href="./assets/favicon.png" />
<style>
:root{--bg:#f3f3ef;--ink:#111;--muted:#777;--line:#d8d8d2;--paper:#fff;--accent:#111}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.top{position:sticky;top:0;z-index:20;background:rgba(243,243,239,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.bar{height:64px;display:flex;align-items:center}.brand{width:240px;padding:0 20px;font-weight:800;letter-spacing:-.04em;font-size:20px}.brand small{font-size:9px;font-weight:500;letter-spacing:.14em;margin-left:8px;color:var(--muted)}.search{flex:1;height:100%;border:0;border-left:1px solid var(--line);background:transparent;padding:0 20px;font-size:18px;outline:none}.count{height:100%;min-width:150px;border-left:1px solid var(--line);display:grid;place-items:center;font-size:10px;letter-spacing:.1em}.hero{padding:56px 20px 36px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,480px);gap:40px;align-items:end}.hero h1{font-size:clamp(56px,10vw,150px);line-height:.78;letter-spacing:-.075em;margin:0;font-weight:500}.hero p{font-size:18px;line-height:1.35;margin:0;color:#444;max-width:520px}.toolbar{display:flex;gap:0;border-bottom:1px solid var(--line);overflow:auto;background:var(--bg)}.chip{appearance:none;border:0;border-right:1px solid var(--line);background:transparent;padding:15px 18px;white-space:nowrap;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.chip.active,.chip:hover{background:var(--ink);color:#fff}.preview{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--paper);padding:24px 20px;font-size:28px;outline:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-left:1px solid var(--line)}.card{position:relative;min-height:270px;background:var(--paper);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 18px 20px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden}.card:hover{background:#fafafa}.meta{display:flex;justify-content:space-between;gap:12px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.sample{font-size:clamp(32px,4vw,58px);line-height:1.02;letter-spacing:-.03em;margin:auto 0;overflow-wrap:anywhere}.name{display:flex;align-items:end;justify-content:space-between;gap:12px}.name strong{font-size:15px}.fav{border:0;background:transparent;font-size:18px;cursor:pointer;padding:0}.fav.on{color:#000}.more{display:block;width:100%;padding:24px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;font:10px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.more:hover{background:#111;color:#fff}.empty{padding:80px 20px;border-bottom:1px solid var(--line);font-size:18px}.status{position:fixed;right:14px;bottom:14px;z-index:30;background:#111;color:#fff;padding:9px 11px;font:9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:none}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;bottom:0;width:min(680px,94vw);background:#fff;border-left:1px solid #222;overflow:auto}.panel-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:16px 18px;z-index:2}.close{border:1px solid #aaa;background:#fff;width:34px;height:34px;cursor:pointer}.spec{padding:28px 20px 48px}.spec h2{font-size:clamp(54px,9vw,108px);line-height:.88;letter-spacing:-.06em;margin:20px 0 36px}.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin:24px 0}.fact{padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.fact b{display:block;font:9px ui-monospace,monospace;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.tester{width:100%;min-height:230px;border:1px solid var(--line);padding:18px;font-size:58px;line-height:1.05;resize:vertical;outline:none}.actions{display:flex;gap:8px;margin-top:14px}.btn{border:1px solid #222;background:#fff;padding:12px 14px;cursor:pointer;font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}.btn.primary{background:#111;color:#fff}.error{max-width:720px;margin:15vh auto;padding:24px;border:1px solid #c4c4bf;background:#fff}.footer{padding:20px;display:flex;justify-content:space-between;color:var(--muted);font:9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}@media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.brand{width:auto}.count{display:none}}@media(max-width:560px){.bar{height:56px}.brand small{display:none}.search{font-size:15px}.hero{padding-top:38px}.grid{grid-template-columns:1fr}.card{min-height:230px}.preview{font-size:20px}}
</style>
</head>
<body>
<header class="top"><div class="bar"><div class="brand">ONOD <small>FONTS / DESIGN SPACE</small></div><input id="search" class="search" placeholder="Search typefaces, authors, sources…" autocomplete="off"/><div id="count" class="count mono">LOADING</div></div></header>
<section class="hero"><h1>FONT<br>SPACE</h1><p>Кураторский каталог открытых гарнитур: поиск, живой preview, фильтры и быстрый переход к источнику. Standalone-версия ONOD Fonts.</p></section>
<nav id="filters" class="toolbar"></nav>
<input id="preview" class="preview" value="Съешь ещё этих мягких французских булок, да выпей чаю" aria-label="Preview text" />
<main id="grid" class="grid"></main>
<button id="more" class="more" hidden>Load more</button>
<footer class="footer"><span>ONOD Fonts</span><span id="footerCount">—</span></footer>
<div id="status" class="status">Loading catalog…</div>
<div id="drawer" class="drawer"><article class="panel"><div class="panel-head"><span id="panelKicker" class="mono" style="font-size:10px;letter-spacing:.1em">TYPEFACE</span><button id="close" class="close">×</button></div><div id="panelBody" class="spec"></div></article></div>
<script>
const DATA='https://raw.githubusercontent.com/IMONsergey/onod-fonts/main/src/app/data/font-data/fonts.json.gz';
const state={fonts:[],query:'',cat:'all',limit:120,preview:'Съешь ещё этих мягких французских булок, да выпей чаю',favorites:new Set(JSON.parse(localStorage.getItem('onod-favorites')||'[]')),loaded:new Set()};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fontCss(f){return f.cssStack||`'${String(f.name).replace(/'/g,'')}',sans-serif`}
function loadFont(f){if(state.loaded.has(f.id))return;state.loaded.add(f.id);let href=f.customCssUrl;if(!href&&String(f.sourceUrl||'').includes('fonts.google.com'))href=`https://fonts.googleapis.com/css2?family=${encodeURIComponent(f.name).replace(/%20/g,'+')}:wght@400;700&display=swap`;if(href){const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l)}}
function matches(f){const q=state.query.trim().toLowerCase();const cat=state.cat==='all'||(f.categories||[]).includes(state.cat);if(!cat)return false;if(!q)return true;return [f.name,f.author,f.source,f.license,...(f.tags||[])].join(' ').toLowerCase().includes(q)}
function filtered(){return state.fonts.filter(matches)}
function filters(){const cats=['all','sans-serif','serif','display','monospaced','handwriting'];$('#filters').innerHTML=cats.map(c=>`<button class="chip ${state.cat===c?'active':''}" data-cat="${c}">${c==='all'?'All fonts':c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;state.limit=120;filters();render()})}
function render(){const list=filtered();const shown=list.slice(0,state.limit);$('#count').textContent=`${list.length} / ${state.fonts.length}`;$('#footerCount').textContent=`${state.fonts.length} TYPEFACES`;$('#grid').innerHTML=shown.length?shown.map(f=>`<article class="card" data-id="${esc(f.id)}"><div class="meta mono"><span>${esc((f.categories||[]).join(' / '))}</span><span>${f.variable?'VARIABLE':esc(f.license)}</span></div><div class="sample" style="font-family:${esc(fontCss(f))}">${esc(state.preview||f.name)}</div><div class="name"><div><strong>${esc(f.name)}</strong><div class="mono" style="font-size:9px;color:#777;margin-top:5px">${esc(f.author)} · ${esc(f.source)}</div></div><button class="fav ${state.favorites.has(f.id)?'on':''}" data-fav="${esc(f.id)}" aria-label="favorite">${state.favorites.has(f.id)?'★':'☆'}</button></div></article>`).join(''):`<div class="empty">Nothing found.</div>`;$('#more').hidden=state.limit>=list.length;document.querySelectorAll('.card').forEach((el,i)=>{const f=state.fonts.find(x=>x.id===el.dataset.id);if(i<30)loadFont(f);el.onclick=e=>{if(e.target.closest('[data-fav]'))return;openFont(f)}});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.fav;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);localStorage.setItem('onod-favorites',JSON.stringify([...state.favorites]));render()})}
function openFont(f){loadFont(f);$('#panelKicker').textContent=`TYPEFACE / ${f.source||'SOURCE'}`;$('#panelBody').innerHTML=`<h2 style="font-family:${esc(fontCss(f))}">${esc(f.name)}</h2><p style="font-size:19px;line-height:1.5;max-width:58ch">${esc(f.description||'')}</p><div class="facts"><div class="fact"><b>Designer / Foundry</b>${esc(f.author)}</div><div class="fact"><b>License</b>${esc(f.license)}</div><div class="fact"><b>Weights</b>${esc((f.weights||[]).join(' · '))}</div><div class="fact"><b>Languages</b>${esc((f.languages||[]).join(' · '))}</div></div><textarea class="tester" style="font-family:${esc(fontCss(f))}">${esc(state.preview)}</textarea><div class="actions"><button class="btn primary" id="sourceBtn">Open source ↗</button><button class="btn" id="favBtn">${state.favorites.has(f.id)?'Remove favorite':'Add favorite'}</button></div>`;$('#sourceBtn').onclick=()=>window.open(f.sourceUrl,'_blank','noopener,noreferrer');$('#favBtn').onclick=()=>{state.favorites.has(f.id)?state.favorites.delete(f.id):state.favorites.add(f.id);localStorage.setItem('onod-favorites',JSON.stringify([...state.favorites]));openFont(f);render()};$('#drawer').classList.add('open')}
async function boot(){try{if(!('DecompressionStream'in window))throw new Error('Browser does not support gzip streaming');const r=await fetch(DATA,{cache:'no-store'});if(!r.ok)throw new Error(`Catalog HTTP ${r.status}`);const text=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();state.fonts=JSON.parse(text);filters();render();$('#status').textContent=`${state.fonts.length} fonts loaded`;setTimeout(()=>$('#status').remove(),1400)}catch(err){console.error(err);$('#grid').innerHTML=`<div class="error"><b>Catalog load error</b><p>${esc(err.message||err)}</p><p class="mono" style="font-size:11px">Source code is available in the GitHub repository.</p></div>`;$('#status').textContent='Load error'}}
$('#search').oninput=e=>{state.query=e.target.value;state.limit=120;render()};$('#preview').oninput=e=>{state.preview=e.target.value;render()};$('#more').onclick=()=>{state.limit+=120;render()};$('#close').onclick=()=>$('#drawer').classList.remove('open');$('#drawer').onclick=e=>{if(e.target===$('#drawer'))$('#drawer').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer').classList.remove('open')});boot();
</script>
</body>
</html>
